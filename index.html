    <script type="text/javascript">
      // Early patch for DOM manipulators (Google Translate, Chrome Auto-Translate, Grammarly, etc.)
      if (typeof Node === 'function' && Node.prototype) {
        var origRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            if (child.parentNode) {
              child.parentNode.removeChild(child);
            }
            return child;
          }
          return origRemoveChild.apply(this, arguments);
        };

        var origInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (referenceNode.parentNode) {
              return referenceNode.parentNode.insertBefore(newNode, referenceNode);
            }
            return this.appendChild(newNode);
          }
          return origInsertBefore.apply(this, arguments);
        };
      }

      // Neutralize any Google Translate hover highlighting
      document.addEventListener('mouseover', function(e) {
        if (e.target && e.target.classList && e.target.classList.contains('goog-text-highlight')) {
          e.target.classList.remove('goog-text-highlight');
        }
      }, true);
    </script>
    <style>
      /* Prevent Google Translate hover highlight rectangle and balloon popup */
      html body .goog-text-highlight,
      html body font.goog-text-highlight,
      html body font[class*="goog-text-highlight"],
      html body *[class*="goog-text-highlight"],
      html body font,
      .goog-text-highlight {
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        -webkit-box-shadow: none !important;
        -moz-box-shadow: none !important;
      }
      #goog-gt-tt,
      #goog-gt-tt *,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
